[package]
name = "mfetch"
version = "0.3.1"
authors = ["xdearboy <arsd3v@garticrashers.ru>"]
edition = "2021"
description = "📦 memory-focused system info tool written in Rust."
license = "MIT"
repository = "https://github.com/xdearboy/mfetch"


[dependencies]
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.10"
directories = "6.0.0"
confy = "2.0.0"

[[bin]]
name = "mfetch"
path = "src/main.rs"
