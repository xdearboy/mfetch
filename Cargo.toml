[package]
name = "mfetch"
version = "0.5.0"
authors = ["ORG-FE", "c0redev"]
edition = "2021"
description = "📦 memory-focused system info tool written in Rust."
license = "MIT"
repository = "https://github.com/org-fe/mfetch"


[dependencies]
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.10"

[[bin]]
name = "mfetch"
path = "src/main.rs"
